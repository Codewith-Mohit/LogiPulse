name: CI-CD Frontend UI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**' # Triggers only if files inside the Angular workspace folder change

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate with Azure OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log into Private ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/logipulse-frontend-service:latest -f frontend/Dockerfile .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/logipulse-frontend-service:latest